services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisfordocker:/data
    healthcheck:
      test: redis-cli ping

  app:
    build: .
    ports:
      - "${HOST_PORT:-8080}:8000"
    environment:
      GREETING: ${GREETING:-Hi, composer!}
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"

volumes:
  redisfordocker: